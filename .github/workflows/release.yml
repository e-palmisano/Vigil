name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        run: make archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Export
        run: make export

      - name: Build DMG
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          make dmg VERSION=$VERSION

      - name: Notarize
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          make notarize VERSION=$VERSION
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Vigil-*.dmg
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${REF_NAME#v}
          DMG_PATH="build/Vigil-${VERSION}.dmg"
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/e-palmisano/homebrew-tap.git /tmp/homebrew-tap

          sed -i '' \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "s/sha256 .*/sha256 \"${SHA256}\"/" \
            /tmp/homebrew-tap/Casks/vigil.rb

          cd /tmp/homebrew-tap
          git add Casks/vigil.rb
          git commit -m "chore: update Vigil to v${VERSION}"
          git push
