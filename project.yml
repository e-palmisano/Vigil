name: Vigil
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    macOS: "15.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.2"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Vigil:
    type: application
    platform: macOS
    deploymentTarget: "15.2"
    sources:
      - path: Vigil
    resources:
      - path: Vigil/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.vigil
        PRODUCT_NAME: Vigil
        INFOPLIST_FILE: Vigil/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vigil/Resources/Vigil.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VIGTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.2"
    sources:
      - path: VIGTests
    dependencies:
      - target: Vigil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.vigtests
        GENERATE_INFOPLIST_FILE: YES
